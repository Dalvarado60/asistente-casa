name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Modelo de voz en español (sin internet)
        run: |
          curl -fsSL -o /tmp/modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q /tmp/modelo.zip -d /tmp/modelo
          mkdir -p para-github/apk/app/src/main/assets/model-es
          cp -r /tmp/modelo/vosk-model-small-es-0.42/* para-github/apk/app/src/main/assets/model-es/
          echo "es-0.42" > para-github/apk/app/src/main/assets/model-es/uuid
          du -sh para-github/apk/app/src/main/assets/model-es

      - name: Llave fija
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/casa.jks"
            echo "KS_FILE=$RUNNER_TEMP/casa.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Usando llave fija"
          else
            echo "::warning::No hay llave fija en Secrets: la APK se firma con una llave temporal"
          fi

      - name: Compilar
        working-directory: para-github/apk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EstacionCasa-apk
          path: para-github/apk/app/build/outputs/apk/release/*.apk
