plugins {
    id 'com.android.application'
}

android {
    namespace 'gt.david.asistentecasa'
    compileSdk 34

    defaultConfig {
        applicationId 'gt.david.asistentecasa'
        minSdk 26
        targetSdk 34
        // cada compilación de GitHub sube el número sola → siempre se instala encima
        def corrida = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as Integer
        versionCode(corrida + 100)
        versionName("8." + corrida)
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    // Llave fija para que cada versión se instale ENCIMA de la anterior (sin desinstalar).
    // 1) Si los Secrets de GitHub (KEYSTORE_B64 / KEYSTORE_PASS) abren bien, usa esa.
    // 2) Si no, usa la llave del proyecto (apk/llave/tbot.jks). Nunca una llave al azar.
    def ksFile = System.getenv('KS_FILE')
    signingConfigs {
        fija {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KS_PASS')
                keyAlias 'casa'
                keyPassword System.getenv('KS_PASS')
            }
        }
        proyecto {
            storeFile rootProject.file('llave/tbot.jks')
            storePassword 'tbotcasa2026'
            keyAlias 'tbot'
            keyPassword 'tbotcasa2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.fija : signingConfigs.proyecto
        }
    }

    // que un aviso de revisión no detenga la compilación
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // Reconocimiento de voz sin internet (palabra de activación)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    // Conexión con la tele Samsung (WebSocket seguro) y la red de la casa
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
