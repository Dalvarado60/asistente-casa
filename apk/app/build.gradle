plugins {
    id 'com.android.application'
}

android {
    namespace 'gt.david.asistentecasa'
    compileSdk 34

    defaultConfig {
        applicationId 'gt.david.asistentecasa'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Se firma con la llave de depuración para poder instalarla directo en el celular.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copia la página de la estación (web/estacion.html) dentro de la APK al compilar.
tasks.register('copiarEstacion', Copy) {
    from("${rootDir}/../web/estacion.html")
    into("${projectDir}/src/main/assets")
}
preBuild.dependsOn('copiarEstacion')

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
